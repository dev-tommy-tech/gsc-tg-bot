# Daily Google Search Console → Telegram report
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   GSC_SERVICE_ACCOUNT_JSON  full service-account JSON
#   GSC_SITE_URL              e.g. sc-domain:lodi646app.ph  or  https://lodi646app.ph/
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
#
# Cron is 01:00 UTC = 09:00 Asia/Shanghai.

name: GSC Daily Telegram Report

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gsc_report/requirements.txt

      - name: Install dependencies
        run: pip install -r gsc_report/requirements.txt

      - name: Run GSC report
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gsc_report/gsc_telegram_report.py
